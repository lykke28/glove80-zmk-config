# Enable per-layer RGB underglow (darknao/valdur fork feature).
# Required for the underglow-layer block in the keymap to take effect.
CONFIG_EXPERIMENTAL_RGB_LAYER=y

# Turn underglow off after 30s idle to save battery when running wireless.
# The layer indicator comes back on instantly on the next keypress.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
